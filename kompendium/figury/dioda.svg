if" font-size="10">2) D zaporowa  &#8594;  rozwarcie,</text><text x="250" y="116" text-anchor="start" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="10">   sprawd&#378; u_D &lt; 0.</text><text x="250" y="146" text-anchor="start" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="10">Charakterystyka dw&#243;jnika =</text><text x="250" y="162" text-anchor="start" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="10">z&#322;o&#380;enie obu przypadk&#243;w</text></svg>